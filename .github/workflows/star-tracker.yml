name: Track Stars

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch star history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" > "${RUNNER_TEMP}/repository.json"
          if ! gh api --paginate --slurp \
            -H 'Accept: application/vnd.github.star+json' \
            "repos/${GITHUB_REPOSITORY}/stargazers?per_page=100" \
            > "${RUNNER_TEMP}/stargazers.json"; then
            echo 'Stargazer timestamps are restricted; using aggregate history fallback.'
            echo '[]' > "${RUNNER_TEMP}/stargazers.json"
          fi
      - name: Generate chart
        run: |
          python3 scripts/generate_star_history.py \
            --stargazers "${RUNNER_TEMP}/stargazers.json" \
            --repository "${RUNNER_TEMP}/repository.json" \
            --history docs/assets/star-history.json \
            --history-output docs/assets/star-history.json \
            --output docs/assets/star-history.svg
      - name: Publish updated chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/assets/star-history.svg docs/assets/star-history.json; then
            echo 'Star history is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c automation/star-history
          git add docs/assets/star-history.svg docs/assets/star-history.json
          git commit -m 'chore: update star history chart'
          git push --force origin HEAD:automation/star-history
          pr_number=$(gh pr list \
            --head automation/star-history \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "${pr_number}" ]; then
            pr_url=$(gh pr create \
              --base main \
              --head automation/star-history \
              --title 'chore: update star history chart' \
              --body 'Automated update generated from GitHub stargazer timestamps.')
            pr_number=${pr_url##*/}
          fi
          head_sha=$(git rev-parse HEAD)
          for workflow in ci.yml codeql.yml; do
            run_id=''
            for _ in {1..30}; do
              run_id=$(gh run list \
                --workflow "${workflow}" \
                --branch automation/star-history \
                --event pull_request \
                --limit 10 \
                --json databaseId,headSha,status,conclusion \
                --jq ".[] | select(.headSha == \"${head_sha}\" and .status == \"completed\" and .conclusion == \"action_required\") | .databaseId" \
                | head -n 1)
              [ -n "${run_id}" ] && break
              sleep 2
            done
            if [ -z "${run_id}" ]; then
              echo "Could not find the blocked ${workflow} run for ${head_sha}." >&2
              exit 1
            fi
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve"
            gh run watch "${run_id}" --exit-status
          done
          gh pr merge "${pr_number}" --auto --squash
          for _ in {1..30}; do
            if [ "$(gh pr view "${pr_number}" --json state --jq .state)" = 'MERGED' ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Star history PR #${pr_number} did not merge." >&2
          exit 1
